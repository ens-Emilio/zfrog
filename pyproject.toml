[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zfrog"
version = "0.1.0"
description = "Design reference engine: capture, organize and adapt web design references"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Zfrog Contributors" }
]
keywords = ["design-reference", "screenshots", "playwright", "crawler", "web-capture", "offline-archive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    # No `[all]` extra: Typer dropped it, and the lockfile warns on every resolve
    # because of it. The rich-based extras it used to pull are declared directly.
    "typer>=0.9.0",
    "celery[redis]>=5.3.0",
    "playwright>=1.40.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "rich>=13.7.0",
    "psutil>=5.9.0",
    "litellm>=1.50.0",
    "instructor>=1.0.0",
    "trafilatura>=2.0.0",
    "rapidfuzz>=3.0.0",
    "Pillow>=10.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.20.0",
    "pytest-cov>=4.1.0",
    # The CI workflow runs `ruff check .`, so it has to be installed with the
    # test dependencies rather than assumed present.
    "ruff>=0.6.0",
]
curl = [
    "curl-cffi>=0.5.0",
]

[project.scripts]
zfrog = "zfrog.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/zfrog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.coverage.run]
source = ["zfrog"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
