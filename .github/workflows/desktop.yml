name: Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: "deb,appimage"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: "nsis,msi"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux WebView deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf wget

      - name: Install Python deps + PyInstaller
        run: |
          pip install -e .
          pip install "PyInstaller>=6"

      - name: Build sidecar binary
        run: python scripts/build-sidecar.py

      - name: Verify sidecar
        run: python scripts/build-sidecar.py --check

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build


      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "zfrog ${{ github.ref_name }}"
          releaseBody: "Desktop release — AppImage/.deb (Linux) + .exe/.msi (Windows). Auto-update via GitHub Releases."
          releaseDraft: false
          prerelease: false
          projectPath: src-tauri
          args: --verbose

  # Optional: keep a separate latest.json check — Tauri updater reads it from the latest release assets
  # No extra job needed; tauri-action already uploads bundles + latest.json signatures to the release
