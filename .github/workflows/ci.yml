name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Every store writes under this root, so a run cannot leak state between jobs
  # or into the repository.
  ZFROG_DATA_DIR: ${{ github.workspace }}/.ci-data

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml, 3.12 is what the image
        # ships, 3.14 is what development runs on. Testing only one of them lets a
        # version-specific break ship.
        python-version: ["3.11", "3.12", "3.14"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The mirror engine shells out to the wget binary, so it is a real
      # dependency of the test suite, not just of the image.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends wget

      # `uv.lock` is committed, so a resolve that drifts from it is a real change
      # someone should look at rather than a silent one. Checked before the install
      # so a drift fails in seconds instead of after a two-minute pip resolve.
      - name: Check the lockfile is current
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv lock --check

      - name: Install the package and test dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        # Correctness rules only: F821 (undefined name), F811 (redefinition),
        # F402 (import shadowed by a loop variable) and E9 (syntax). Those catch
        # bugs — the first runs of this gate found an undefined `new_script` in
        # engines/static_file.py (a NameError swallowed by `except Exception`),
        # four `Optional` annotations that were never imported (NameError at
        # runtime via `from __future__ import annotations`), a Python-3.12-only
        # f-string in tests/test_sso.py (SyntaxError on the declared 3.11 floor),
        # a redundant local `update_job` import in api.py, and a loop variable
        # shadowing a module import (`signal` in cli.py).
        #
        # The style rules in pyproject.toml (E501 line length, I001 import order,
        # UP0xx modernisation) report ~450 violations on the existing code, so
        # enabling them here would open with a red build that nobody could trust.
        # Tightening this is tracked work, not a silent omission.
        run: ruff check . --select F821,F811,F402,E9

      - name: Run the suite
        env:
          ZFROG_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          mkdir -p "$ZFROG_DATA_DIR"
          pytest tests/ -q

  dashboard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Typecheck
        working-directory: dashboard
        run: npx tsc --noEmit

      # Vite bundle check — catches broken imports/chunks that `tsc --noEmit`
      # misses (e.g. a bad dynamic import). Previous comment mentioned
      # Next.js standalone; this project uses Vite (TanStack Router).
      - name: Build
        working-directory: dashboard
        env:
          VITE_API_URL: http://127.0.0.1:8000
        run: npm run build
