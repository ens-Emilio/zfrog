name: zfrog

services:
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zfrog-api
    command: >
      uvicorn zfrog.api:app --host 0.0.0.0 --port 8000
      --workers ${API_WORKERS:-2} --proxy-headers
    ports:
      - "127.0.0.1:8200:8000"
    volumes:
      - zfrog-data:/app/data
      - ./ai_config.yaml:/app/ai_config.yaml:ro
    environment:
      - ZFROG_DATA_DIR=/app/data
      - ZFROG_REDIS_URL=redis://valkey:6379/0
      - ZFROG_AI_MODEL=${ZFROG_AI_MODEL:-ollama/qwen2.5}
      - ZFROG_AUTH_ENABLED=${ZFROG_AUTH_ENABLED:-false}
      - ZFROG_CORS_ORIGINS=${ZFROG_CORS_ORIGINS:-https://zfrog.pages.dev,https://zfrog.truuz.com.br,http://localhost:3000}
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - default
      - sni-shared-net
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zfrog-worker
    command: >
      celery -A zfrog.queue worker -l info -c ${WORKER_CONCURRENCY:-2}
    volumes:
      - zfrog-data:/app/data
      - ./ai_config.yaml:/app/ai_config.yaml:ro
    environment:
      - ZFROG_DATA_DIR=/app/data
      - ZFROG_REDIS_URL=redis://valkey:6379/0
      - ZFROG_AI_MODEL=${ZFROG_AI_MODEL:-ollama/qwen2.5}
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"

volumes:
  valkey-data:
  zfrog-data:

networks:
  default:
  sni-shared-net:
    external: true
